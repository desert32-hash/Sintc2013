    <!-- Scripts -->
    <script>
        // Dynamic Load More functionality without Random Shuffle
        document.addEventListener('DOMContentLoaded', function() {
            const galleryGrid = document.querySelector('.gallery-grid-5cols');
            const loadMoreContainer = document.getElementById('loadMoreContainer');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            // Configuration
            const initialDisplayCount = 40; // 처음에 보여줄 이미지 수
            const loadMoreCount = 40; // 더보기 클릭 시 추가로 보여줄 이미지 수
            
            let currentDisplayedCount = initialDisplayCount;
            const totalImages = galleryGrid.children.length;
            
            // Initial state setup
            function initializeGallery() {
                // Hide images beyond initial display count
                for (let i = 0; i < totalImages; i++) {
                    if (i >= initialDisplayCount) {
                        galleryGrid.children[i].style.display = 'none';
                    }
                }
                
                // Update load more button visibility
                updateLoadMoreButton();
            }
            
            // Update load more button state
            function updateLoadMoreButton() {
                if (totalImages > currentDisplayedCount) {
                    loadMoreContainer.style.display = 'block';
                    loadMoreBtn.textContent = `더보기 (${currentDisplayedCount} / ${totalImages})`;
                } else {
                    loadMoreContainer.style.display = 'none';
                }
            }
            
            // Load more button click handler
            window.loadMoreImages = function() {
                const nextCount = Math.min(currentDisplayedCount + loadMoreCount, totalImages);
                
                // Show hidden images
                for (let i = currentDisplayedCount; i < nextCount; i++) {
                    galleryGrid.children[i].style.display = 'block';
                }
                
                currentDisplayedCount = nextCount;
                updateLoadMoreButton();
            };
            
            // Initialize gallery
            initializeGallery();
        });

        // Modal functionality
        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'block';
            modalImg.src = imageSrc;
        }

        // Close modal
        document.querySelector('.close').onclick = function() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>

    <!-- Gallery Randomizer Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.querySelector('.gallery-grid-5cols');
            if (gallery) {
                const items = Array.from(gallery.children);
                // Fisher-Yates shuffle algorithm
                for (let i = items.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [items[i], items[j]] = [items[j], items[i]];
                }
                // Re-append items in new order
                items.forEach(item => gallery.appendChild(item));
            }
        });
    </script>

    <!-- Mobile Menu Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
            const mainNav = document.querySelector('.main-nav');
            
            mobileMenuToggle.addEventListener('click', function() {
                mainNav.classList.toggle('active');
            });
            
            // Close mobile menu when clicking on a link
            const navLinks = document.querySelectorAll('.main-nav a');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    mainNav.classList.remove('active');
                });
            });
        });
    </script>
