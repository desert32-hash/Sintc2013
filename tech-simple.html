---
layout: null
---
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신성테크 홈페이지 입니다.</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css">
</head>
<body>
    <h1>기술자료 게시판</h1>
    <p>게시글 수: {{ site.posts.size }}</p>
    
    {% for post in site.posts %}
    <div>
        <h2>{{ post.title }}</h2>
        <p>{{ post.date | date: "%Y-%m-%d" }}</p>
    </div>
    {% endfor %}
    
    <a href="{{ site.baseurl }}/index.html">홈으로</a>
</body>
</html>
